[project]
name = "quickpic"
version = "0.1.0"
description = "Open-set face recognition for classroom attendance from a single photograph"
authors = [
    { name = "Tanish Mittal", email = "tanish.20233288@mnnit.ac.in" }
]
requires-python = ">=3.11"
dependencies = [
    "insightface>=0.7.3",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "opencv-python>=4.10,<5",
    "pillow>=10",
    "pillow-heif>=0.16",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
